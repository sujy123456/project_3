name: MoonBit CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon fmt --check
      - run: moon check
      - run: moon test
      - run: moon build --target native
      - run: moon publish --dry-run
